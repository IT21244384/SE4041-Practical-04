# XcodeGen spec used to generate MarksApp.xcodeproj (run `xcodegen generate` in this folder on a Mac).
name: MarksApp
options:
  bundleIdPrefix: lk.ac.sliit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  MarksApp:
    type: application
    platform: iOS
    sources:
      - MarksApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.ac.sliit.MarksApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SE4041 Marks
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  MarksAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MarksAppUITests
    dependencies:
      - target: MarksApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.ac.sliit.MarksAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MarksApp
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  MarksApp:
    build:
      targets:
        MarksApp: all
    test:
      targets:
        - MarksAppUITests
